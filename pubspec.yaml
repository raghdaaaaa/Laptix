name: laptix
description: "Laptix: a student laptop recommendation and compatibility checker."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  google_fonts: ^6.3.2
  flutter_svg: ^2.0.10+1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/icons/common/
    - assets/images/icons/nav/
    - assets/images/icons/home/
    - assets/images/icons/major/
    - assets/images/icons/usage/
    - assets/images/icons/budget/
    - assets/images/icons/result/
    - assets/images/icons/checker/
    - assets/google_fonts/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#1E3A8A"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  remove_alpha_ios: true